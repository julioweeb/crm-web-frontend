<div class="tela">
  <section class="lado">
    <div class="nome">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="4" width="28" height="5" rx="2.5" fill="#8fa6b8" />
        <rect x="6" y="12" width="20" height="5" rx="2.5" fill="#4aa6a8" />
        <rect x="10" y="20" width="12" height="5" rx="2.5" fill="#3fa66b" />
      </svg>
      CRM
    </div>
    <div>
      <div class="funil" aria-hidden="true">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <h2>Cada negociação no seu lugar.</h2>
      <p>Clientes, leads e oportunidades em um só sistema, do primeiro contato ao fechamento.</p>
    </div>
    <span></span>
  </section>

  <section class="form-lado">
    <form class="caixa" (ngSubmit)="enviar()" #f="ngForm">
      <h1>Entrar</h1>
      <p class="subtitulo" style="margin-bottom: 1.5rem">Use seu e-mail e senha para acessar.</p>

      @if (erro()) {
        <div class="msg-erro" role="alert">{{ erro() }}</div>
      }

      <div class="campo">
        <label for="email">E-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          autocomplete="username"
        />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          [(ngModel)]="senha"
          required
          autocomplete="current-password"
        />
      </div>

      <button
        class="btn"
        style="width: 100%; padding: 0.7rem"
        type="submit"
        [disabled]="carregando() || f.invalid"
      >
        {{ carregando() ? 'Aguarde...' : 'Entrar' }}
      </button>

      <p class="dica" style="text-align: center; margin-top: 1.25rem">
        O acesso é disponibilizado pelo administrador do sistema.
      </p>
    </form>
  </section>
</div>
