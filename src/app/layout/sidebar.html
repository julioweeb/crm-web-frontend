<aside class="sidebar" [class.aberto]="aberto()">
  <div class="marca">
    <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#logo" /></svg>CRM
  </div>

  <nav (click)="fechar.emit()" aria-label="Principal">
    @for (item of itens(); track item.rota) {
      <a [routerLink]="item.rota" routerLinkActive="ativo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="item.icone" /></svg>
        {{ item.texto }}
      </a>
    }
  </nav>

  @if (instalar.disponivel()) {
    <button class="btn-instalar" (click)="instalar.instalar()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" /></svg>
      Instalar app
    </button>
  }

  <a class="link-perfil" routerLink="/perfil" routerLinkActive="ativo" (click)="fechar.emit()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0" /></svg>
    Meu perfil
  </a>

  <div class="usuario">
    <div class="avatar" aria-hidden="true">{{ inicial() }}</div>
    <div class="quem">
      <div class="nome">{{ auth.usuario()?.nome }}</div>
      <div class="perfil">{{ rotulo[auth.usuario()?.perfil ?? ''] }}</div>
    </div>
    <button class="btn-tema" (click)="tema.alternar()" [attr.aria-label]="tema.tema() === 'escuro' ? 'Usar tema claro' : 'Usar tema escuro'" [title]="tema.tema() === 'escuro' ? 'Tema claro' : 'Tema escuro'">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        @if (tema.tema() === 'escuro') {
          <path d="M12 17a5 5 0 100-10 5 5 0 000 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l-1.4 1.4M18.4 5.6l1.4-1.4" />
        } @else {
          <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
        }
      </svg>
    </button>
    <button class="btn-sair" (click)="auth.sair()" aria-label="Sair" title="Sair">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" /></svg>
    </button>
  </div>
</aside>
