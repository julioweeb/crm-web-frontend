<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CRM</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Aplica o tema antes do Angular carregar, para a tela não piscar em branco no modo escuro. -->
  <script>
    try {
      var t = localStorage.getItem('crm_tema');
      if (t !== 'claro' && t !== 'escuro') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      }
      document.documentElement.setAttribute('data-tema', t);
      if (t === 'escuro') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#162129');
    } catch (e) { /* sem localStorage: fica no tema claro */ }
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Ative o JavaScript para usar o CRM.</noscript>
</body>
</html>
